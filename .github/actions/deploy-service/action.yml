name: deploy-service
description: 把 image 部署到指定環境的 Cloud Run，並套用 .cicd 設定與 Cloud SQL 掛載。

# 這個 action 刻意「不」處理憑證，也設不了 permissions —— 兩者都是安全邊界，
# 必須留在 deploy.yml 的 job 層看得見的地方。呼叫端 job 要先跑
# google-github-actions/auth 並帶 permissions: id-token: write。
#
# composite action 不繼承 workflow 層的 env:，所以 AR_HOST / AR_REPO /
# SQL_INSTANCE 這些平台常數也得當 input 傳進來。

inputs:
  service:
    required: true
    description: Cloud Run 服務名
  digest:
    required: true
    description: image digest（sha256:…）
  region:
    required: true
    description: 部署區域
  project:
    required: true
    description: 目標 GCP 專案
  env_name:
    required: true
    description: dev 或 prod，會注入成 APP_ENV
  app_version:
    required: false
    default: ''
    description: 注入成 APP_VERSION。dev 不傳，app 端自己退回 "(dev build)"
  allow_unauthenticated:
    required: true
    description: 'true / false'
  runtime_sa:
    required: true
    description: 執行身分的 SA ID（.cicd/config.yml 的 runtime_sa）
  db_name:
    required: false
    default: ''
    description: 空字串代表這個服務不用 Cloud SQL
  ar_host:
    required: true
    description: Artifact Registry host
  ar_repo:
    required: true
    description: Artifact Registry repo
  sql_instance:
    required: true
    description: 該環境的共用 Cloud SQL instance

outputs:
  url:
    description: 部署後的 Cloud Run URL
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: composite
  steps:
    - name: gcloud run deploy
      id: deploy
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        DIGEST: ${{ inputs.digest }}
        REGION: ${{ inputs.region }}
        PROJECT: ${{ inputs.project }}
        ENV_NAME: ${{ inputs.env_name }}
        APP_VERSION: ${{ inputs.app_version }}
        UNAUTH: ${{ inputs.allow_unauthenticated }}
        RUNTIME_SA: ${{ inputs.runtime_sa }}
        DB_NAME: ${{ inputs.db_name }}
        AR_HOST: ${{ inputs.ar_host }}
        AR_REPO: ${{ inputs.ar_repo }}
        SQL_INSTANCE: ${{ inputs.sql_instance }}
      run: |
        set -euo pipefail
        IMAGE="${AR_HOST}/${PROJECT}/${AR_REPO}/${SERVICE}@${DIGEST}"

        # ── 設定與機密 ────────────────────────────────────────────────
        # .cicd/env.<env>      非機密設定，KEY=VALUE，進版控
        # .cicd/secrets.<env>  只放 Secret Manager 的「名字」，KEY=secret-name:version
        # 用 ^@@^ 自訂分隔符，值裡面才可以出現逗號與 @（DB_USER 就含 @）。
        ENV_FILE=".cicd/env.${ENV_NAME}"
        SEC_FILE=".cicd/secrets.${ENV_NAME}"

        # 一律用 --update-env-vars（合併），永遠不用 --set-env-vars（取代全部）。
        # CI 只新增/更新它認得的變數，絕不刪除任何它不知道的東西 —— 你在 Cloud Run
        # 主控台設的變數不會被抹掉。
        # 代價：從 .cicd/env.<env> 刪掉一行，Cloud Run 上那個變數不會自動消失，
        # 要手動移除：gcloud run services update <svc> --remove-env-vars=KEY
        # common 先讀、環境專屬後讀 —— 同名 key 由環境專屬覆蓋。兩邊一樣的設定只寫
        # 一次就好，不用在 dev/prod 各抄一遍（抄兩遍的東西遲早會分歧）。
        merge() {
          for f in "$@"; do
            [ -f "$f" ] && { grep -vE '^[[:space:]]*(#|$)' "$f" || true; }
          done | awk -F= '
            { k=$1; v=substr($0, index($0,"=")+1)
              if (!(k in val)) order[++n]=k
              val[k]=v }
            END { for (i=1;i<=n;i++) print order[i]"="val[order[i]] }'
        }

        PAIRS="APP_ENV=${ENV_NAME}"
        [ -n "${APP_VERSION:-}" ] && PAIRS="${PAIRS}@@APP_VERSION=${APP_VERSION}"
        while IFS= read -r line; do
          if [ -n "$line" ]; then PAIRS="${PAIRS}@@${line}"; fi
        done <<< "$(merge '.cicd/env.common' "$ENV_FILE")"
        echo "已套用 .cicd/env.common + ${ENV_FILE}（合併模式，不會刪除既有變數）"

        # ── Cloud SQL ────────────────────────────────────────────────
        # 一個環境一台 instance，服務靠 database 分隔。專案只在 .cicd/config.yml
        # 宣告 db.name 與 runtime_sa；instance 與連線字串由 CI 依「正在部署哪個環境」
        # 推導 —— 連錯環境、連錯 instance 都不是「會被抓到」，是根本沒有欄位可以寫錯。
        # 隔離不來自 IAM（cloudsql.instanceUser 只能綁專案層），來自每個 database 的
        # REVOKE CONNECT FROM PUBLIC + 逐服務 GRANT。前提：Cloud SQL 與 Cloud Run 同區域。
        if [ -n "${DB_NAME:-}" ]; then
          ICN="${PROJECT}:${REGION}:${SQL_INSTANCE}"

          # 共用 instance 不存在就停在這裡。這是平台級的一次性資源，
          # 刻意不自動建立：要 10 分鐘、會計費。
          if ! gcloud sql instances describe "$SQL_INSTANCE" --project="$PROJECT" >/dev/null 2>&1; then
            echo "::error::${PROJECT} 找不到共用 Cloud SQL instance「${SQL_INSTANCE}」。"
            echo "::error::這是平台級的一次性資源，見 ci/README.md「開共用 instance」："
            echo "::error::  gcloud sql instances create ${SQL_INSTANCE} --project=${PROJECT} --region=${REGION} \\"
            echo "::error::    --edition=ENTERPRISE --database-version=POSTGRES_17 --tier=db-f1-micro \\"
            echo "::error::    --database-flags=cloudsql.iam_authentication=on"
            exit 1
          fi

          # 執行身分同樣是一次性資源。CI 刻意沒有 iam.* 權限 —— 一個能建 SA
          # 又能發角色的部署身分，等於能把任何權限發給自己，WIF 那道鎖就白做了。
          if ! gcloud iam service-accounts describe \
               "${RUNTIME_SA}@${PROJECT}.iam.gserviceaccount.com" --project="$PROJECT" >/dev/null 2>&1; then
            echo "::error::${PROJECT} 找不到執行身分「${RUNTIME_SA}」（.cicd/config.yml 的 runtime_sa）。"
            echo "::error::這是一次性資源，要有 GCP 權限的人跑一次，不是 CI 的職責："
            echo "::error::  gcloud iam service-accounts create ${RUNTIME_SA} --project=${PROJECT}"
            echo "::error::還要授 cloudsql.client / cloudsql.instanceUser、綁 deployer 的 serviceAccountUser、"
            echo "::error::補 secret accessor、建 database「${DB_NAME}」、建 IAM DB user、下 REVOKE/GRANT ——"
            echo "::error::完整步驟見 ci/README.md「服務要用資料庫」。"
            exit 1
          fi

          PAIRS="${PAIRS}@@DB_NAME=${DB_NAME}"
          PAIRS="${PAIRS}@@INSTANCE_CONNECTION_NAME=${ICN}@@DB_USER=${RUNTIME_SA}@${PROJECT}.iam"
          echo "已推導 Cloud SQL：${ICN} / ${DB_NAME}（DB 帳號 ${RUNTIME_SA}@${PROJECT}.iam）"
        fi

        SEC_PAIRS=""
        while IFS= read -r line; do
          if [ -n "$line" ]; then SEC_PAIRS="${SEC_PAIRS:+${SEC_PAIRS}@@}${line}"; fi
        done <<< "$(merge '.cicd/secrets.common' "$SEC_FILE")"
        if [ -n "$SEC_PAIRS" ]; then
          echo "已掛載 .cicd/secrets.common + ${SEC_FILE}（只掛名字，值留在 Secret Manager）"
        fi

        ARGS=(
          "$SERVICE"
          --image="$IMAGE"
          --region="$REGION"
          --project="$PROJECT"
          --service-account="${RUNTIME_SA}@${PROJECT}.iam.gserviceaccount.com"
          --platform=managed
          --quiet
          "--update-env-vars=^@@^${PAIRS}"
        )
        if [ -n "$SEC_PAIRS" ]; then
          ARGS+=("--update-secrets=^@@^${SEC_PAIRS}")
        fi
        if [ -n "${ICN:-}" ]; then
          ARGS+=("--add-cloudsql-instances=${ICN}")
        fi
        if [ "$UNAUTH" = "true" ]; then
          ARGS+=(--allow-unauthenticated)
        else
          ARGS+=(--no-allow-unauthenticated)
        fi

        gcloud run deploy "${ARGS[@]}"

        URL=$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT" --format='value(status.url)')
        echo "url=${URL}" >> "$GITHUB_OUTPUT"
        echo "✅ ${ENV_NAME} → ${URL}"
