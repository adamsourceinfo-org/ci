# PR 檢查。完全不碰 GCP、不推 image、不需要任何憑證。
# 這支的用途是當 main 分支保護的 required status check：建不起來的東西進不了 main。
name: ci (reusable)

on:
  workflow_call:
    inputs:
      service:
        type: string
        required: false
        default: ""
      dockerfile:
        type: string
        required: false
        default: Dockerfile

jobs:
  verify:
    name: 1 verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 檢查契約
        env:
          IN_SERVICE: ${{ inputs.service }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          SERVICE="${IN_SERVICE:-${GITHUB_REPOSITORY##*/}}"

          if ! printf '%s' "$SERVICE" | grep -Eq '^[a-z]([-a-z0-9]*[a-z0-9])?$'; then
            echo "::error::服務名稱 '$SERVICE' 不符合 Cloud Run 規則（小寫字母開頭，只能有小寫字母/數字/連字號）。"
            exit 1
          fi
          if [ ${#SERVICE} -gt 49 ]; then
            echo "::error::服務名稱 '$SERVICE' 超過 49 字元。"
            exit 1
          fi
          if [ ! -f "$DOCKERFILE" ]; then
            echo "::error::找不到 ${DOCKERFILE}。adamsourceinfo-org 的部署契約要求每個專案自備 Dockerfile。"
            exit 1
          fi

          for f in .cicd/env.dev .cicd/env.prod .cicd/secrets.dev .cicd/secrets.prod; do
            [ -f "$f" ] || continue
            if grep -vE '^\s*(#|$)' "$f" | grep -qvE '^[A-Za-z_][A-Za-z0-9_]*='; then
              echo "::error::$f 有不合法的行。格式必須是 KEY=VALUE，一行一個。"
              exit 1
            fi
          done

          for f in .cicd/secrets.dev .cicd/secrets.prod; do
            [ -f "$f" ] || continue
            if grep -vE '^\s*(#|$)' "$f" | grep -qvE '^[A-Za-z_][A-Za-z0-9_]*=[a-z0-9][a-z0-9_-]*:(latest|[0-9]+)$'; then
              echo "::error::$f 格式錯誤。這個檔案只能放 Secret Manager 的『名字』，不能放值："
              echo "::error::  正確 → DB_PASSWORD=myapp-db-password-dev:latest"
              echo "::error::  錯誤 → DB_PASSWORD=hunter2"
              exit 1
            fi
          done

          # INSTANCE_CONNECTION_NAME / DB_USER 由 CI 依部署環境推導後注入。手寫的話會跟
          # 注入值一起進 --update-env-vars，同名 key 誰贏未定義。deploy 的 verify 也有
          # 同一份檢查，但那要等併進 main 才會跑 —— 開發者要的是 PR 上就看到紅燈。
          for E in dev prod; do
            F=".cicd/env.${E}"
            [ -f "$F" ] || continue
            for KEY in INSTANCE_CONNECTION_NAME DB_USER; do
              if grep -Eq "^[[:space:]]*${KEY}=" "$F"; then
                echo "::error::${F} 不可以自己設定 ${KEY} —— 這個值由 CI 依部署目標推導。"
                echo "::error::請改成宣告 DB_INSTANCE=<instance 名稱>，CI 會組出 <專案>:<區域>:<instance>。"
                exit 1
              fi
            done
          done

          # 只有一邊宣告 DB_INSTANCE 是合法的漸進上線，警告但不擋。
          db_declared() {
            [ -f ".cicd/env.$1" ] && grep -Eq '^[[:space:]]*DB_INSTANCE=' ".cicd/env.$1"
          }
          if db_declared dev && ! db_declared prod; then
            echo "::warning::.cicd/env.dev 宣告了 DB_INSTANCE 但 .cicd/env.prod 沒有 —— prod 不會掛載 Cloud SQL。"
          elif db_declared prod && ! db_declared dev; then
            echo "::warning::.cicd/env.prod 宣告了 DB_INSTANCE 但 .cicd/env.dev 沒有 —— dev 不會掛載 Cloud SQL。"
          fi

          echo "✅ 契約檢查通過（service=${SERVICE}）"

  build:
    name: 2 build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build（不推）
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          docker build -f "$DOCKERFILE" -t "ci-check:${GITHUB_SHA:0:7}" .
          echo "✅ image 建置成功"
