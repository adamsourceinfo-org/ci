# adamsourceinfo-org 共用部署流程。各專案只放一支 caller stub 呼叫這裡。
#
# 改你自己 repo 的 workflow 不會讓你拿到任何 GCP 權限 —— 換取雲端憑證的條件綁死在
# "adamsourceinfo-org/ci/.github/workflows/deploy.yml@refs/heads/main"。從別的 workflow 呼叫換不到。
#
# 兩條路：
#   push main → 部署 adamsourceinfo-dev
#   push tag  → 把 main 建好的「同一個 image digest」搬到 adamsourceinfo-prod 部署
#
# tag 永遠不重新 build。prod 跑的 binary 逐位元組等於 dev 驗過的那一份。
name: deploy (reusable)

on:
  workflow_call:
    inputs:
      service:
        description: "Cloud Run 服務名稱。留空則用 caller repo 名稱"
        type: string
        required: false
        default: ""
      region:
        description: "Cloud Run 區域"
        type: string
        required: false
        default: asia-east1
      health_path:
        description: "smoke test 打的路徑"
        type: string
        required: false
        default: "/"
      dockerfile:
        description: "Dockerfile 路徑"
        type: string
        required: false
        default: Dockerfile
      allow_unauthenticated:
        description: "是否開放未驗證存取"
        type: boolean
        required: false
        default: true

env:
  DEV_PROJECT: adamsourceinfo-dev
  DEV_PROJECT_NUMBER: "606393814183"
  PROD_PROJECT: adamsourceinfo-prod
  PROD_PROJECT_NUMBER: "197982716696"
  AR_HOST: asia-east1-docker.pkg.dev
  AR_REPO: apps
  WIF_POOL: github
  WIF_PROVIDER: adamsourceinfo-org
  DEPLOYER_SA_ID: github-deployer
  RUNTIME_SA_ID: run-runtime

jobs:
  # ── 1. verify ──────────────────────────────────────────────────────────────
  # 契約檢查。tag 另外驗格式，並確認它指向 main 上的 commit —— 否則 prod 會部署到
  # 從沒經過 dev 的程式碼。
  verify:
    name: 1 verify
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.contract.outputs.service }}
      short_sha: ${{ steps.contract.outputs.short_sha }}
      region: ${{ steps.contract.outputs.region }}
      health_path: ${{ steps.contract.outputs.health_path }}
      dockerfile: ${{ steps.contract.outputs.dockerfile }}
      allow_unauthenticated: ${{ steps.contract.outputs.allow_unauthenticated }}
      db_instance: ${{ steps.contract.outputs.db_instance }}
      db_name: ${{ steps.contract.outputs.db_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 檢查契約
        id: contract
        env:
          IN_SERVICE: ${{ inputs.service }}
          IN_REGION: ${{ needs.verify.outputs.region }}
          IN_HEALTH_PATH: ${{ needs.verify.outputs.health_path }}
          IN_DOCKERFILE: ${{ needs.verify.outputs.dockerfile }}
          IN_UNAUTH: ${{ needs.verify.outputs.allow_unauthenticated }}
        run: |
          set -euo pipefail

          # ── .cicd/config.yml ─────────────────────────────────────────
          # 專案的結構性設定收在這一份。沒有這個檔就全部退回 stub 的 with: 參數，
          # 所以既有專案不改任何東西也照跑。yq 是 ubuntu runner 預裝的。
          CFG=".cicd/config.yml"
          if [ -f "$CFG" ]; then
            command -v yq >/dev/null || { echo "::error::runner 沒有 yq，無法解析 ${CFG}"; exit 1; }
            yq -e 'type == "!!map"' "$CFG" >/dev/null 2>&1 || {
              echo "::error::${CFG} 必須是 YAML mapping（key: value）。"; exit 1; }

            # 擋掉打錯的 key —— 設定檔最常見的失敗是「明明寫了卻沒生效」。
            ALLOWED="service region health_path dockerfile allow_unauthenticated db"
            for K in $(yq -r 'keys | .[]' "$CFG"); do
              case " $ALLOWED " in
                *" $K "*) ;;
                *) echo "::error::${CFG} 有不認得的設定 '${K}'。可用的是：${ALLOWED}"; exit 1 ;;
              esac
            done
            for K in $(yq -r '.db // {} | keys | .[]' "$CFG"); do
              case "$K" in
                instance|name) ;;
                *) echo "::error::${CFG} 的 db 底下有不認得的設定 '${K}'。可用的是：instance name"; exit 1 ;;
              esac
            done
          fi

          cfg() {  # cfg <yq 路徑> <退回值>
            local v=""
            if [ -f "$CFG" ]; then
              # 刻意不用 yq 的 // 運算子：它把 false 也當成「空值」，
              # allow_unauthenticated: false 會被吃掉、退回預設的 true —— 服務靜靜變公開。
              # 不吞錯誤：yq 失敗代表 config.yml 有問題，要大聲停下來，不是退回預設值。
              v="$(yq -r "$1" "$CFG")"
              [ "$v" = "null" ] && v=""
            fi
            printf '%s' "${v:-$2}"
          }

          SERVICE="$(cfg '.service' "${IN_SERVICE:-${GITHUB_REPOSITORY##*/}}")"
          REGION="$(cfg '.region' "$IN_REGION")"
          HEALTH_PATH="$(cfg '.health_path' "$IN_HEALTH_PATH")"
          DOCKERFILE="$(cfg '.dockerfile' "$IN_DOCKERFILE")"
          UNAUTH="$(cfg '.allow_unauthenticated' "$IN_UNAUTH")"
          DB_INSTANCE="$(cfg '.db.instance' '')"
          DB_NAME="$(cfg '.db.name' '')"

          if [ -n "$DB_INSTANCE" ] && [ -z "$DB_NAME" ]; then
            echo "::error::${CFG} 宣告了 db.instance 就必須一併給 db.name。"; exit 1
          fi
          if ! printf '%s' "$SERVICE" | grep -Eq '^[a-z]([-a-z0-9]*[a-z0-9])?$'; then
            echo "::error::服務名稱 '$SERVICE' 不符合 Cloud Run 規則（小寫字母開頭，只能有小寫字母/數字/連字號）。請在 stub 用 service: 指定合法名稱。"
            exit 1
          fi
          if [ ${#SERVICE} -gt 49 ]; then
            echo "::error::服務名稱 '$SERVICE' 超過 49 字元。"
            exit 1
          fi

          if [ ! -f "$DOCKERFILE" ]; then
            echo "::error::找不到 ${DOCKERFILE}。adamsourceinfo-org 的部署契約要求每個專案自備 Dockerfile。"
            exit 1
          fi

          {
            echo "service=$SERVICE"
            echo "short_sha=${GITHUB_SHA:0:7}"
            echo "region=$REGION"
            echo "health_path=$HEALTH_PATH"
            echo "dockerfile=$DOCKERFILE"
            echo "allow_unauthenticated=$UNAUTH"
            echo "db_instance=$DB_INSTANCE"
            echo "db_name=$DB_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "✅ service=$SERVICE  region=$REGION  dockerfile=$DOCKERFILE  sha=${GITHUB_SHA:0:7}"
          [ -n "$DB_INSTANCE" ] && echo "   Cloud SQL：${DB_INSTANCE} / ${DB_NAME}（來自 ${CFG}，只宣告一次）"

      - name: 檢查 .cicd 設定契約
        run: |
          set -euo pipefail

          # INSTANCE_CONNECTION_NAME / DB_USER 由 CI 依部署目標推導後注入；
          # DB_INSTANCE / DB_NAME 現在宣告在 .cicd/config.yml（只寫一次）。
          # 這些出現在 env 檔裡會跟注入值撞名，誰贏未定義 —— 擋下來比安靜地不確定好。
          for F in .cicd/env.common .cicd/env.dev .cicd/env.prod; do
            [ -f "$F" ] || continue
            for KEY in INSTANCE_CONNECTION_NAME DB_USER; do
              if grep -Eq "^[[:space:]]*${KEY}=" "$F"; then
                echo "::error::${F} 不可以自己設定 ${KEY} —— 這個值由 CI 依部署目標推導。"
                echo "::error::請在 .cicd/config.yml 宣告 db.instance 與 db.name。"
                exit 1
              fi
            done
            for KEY in DB_INSTANCE DB_NAME; do
              if grep -Eq "^[[:space:]]*${KEY}=" "$F"; then
                echo "::error::${F} 的 ${KEY} 要搬到 .cicd/config.yml —— 那裡只宣告一次，不會 dev/prod 分歧："
                echo "::error::  db:"
                echo "::error::    instance: <instance 名稱>"
                echo "::error::    name: <database 名稱>"
                exit 1
              fi
            done
          done

          echo "✅ .cicd 設定契約檢查通過"

      - name: 驗證 tag（僅 tag 觸發）
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$TAG' 格式不對。正式發布的 tag 必須是 vMAJOR.MINOR.PATCH，例如 v1.0.3。"
            echo "::error::（本 workflow 刻意接收所有 tag 再在這裡擋下來。用 glob 過濾的話，格式錯的 tag 會安靜地什麼都不發生，比紅燈難查得多。）"
            exit 1
          fi

          if ! git branch -r --contains "$GITHUB_SHA" | grep -qE '^\s*origin/main$'; then
            echo "::error::tag '$TAG' 指向的 commit ($GITHUB_SHA) 不在 main 上。"
            echo "::error::prod 只部署 main 驗證過的 image。請把 commit 併進 main 之後再打 tag。"
            exit 1
          fi
          echo "✅ tag $TAG 格式正確且指向 main"

  # ── 2. build-push（只有 main）───────────────────────────────────────────────
  build-push:
    name: 2 build-push → dev AR
    if: github.ref_type == 'branch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.DEV_PROJECT }}
          workload_identity_provider: projects/${{ env.DEV_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL }}/providers/${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA_ID }}@${{ env.DEV_PROJECT }}.iam.gserviceaccount.com

      - name: 確認 gcloud 可用
        run: |
          # ubuntu runner 預裝 gcloud，所以不用 setup-gcloud（那一步每個 job 要花 15~25 秒）。
          # 若哪天 runner image 拿掉了，這裡會立刻紅燈，而不是在後面噴看不懂的錯。
          command -v gcloud >/dev/null || { echo "::error::runner 沒有預裝 gcloud，請把 setup-gcloud 加回來"; exit 1; }
          gcloud --version | head -1

      - name: docker 登入 Artifact Registry
        run: gcloud auth configure-docker "${AR_HOST}" --quiet

      - name: build & push
        id: push
        env:
          SERVICE: ${{ needs.verify.outputs.service }}
          SHORT_SHA: ${{ needs.verify.outputs.short_sha }}
          DOCKERFILE: ${{ needs.verify.outputs.dockerfile }}
        run: |
          set -euo pipefail
          IMAGE="${AR_HOST}/${DEV_PROJECT}/${AR_REPO}/${SERVICE}"

          docker build -f "$DOCKERFILE" -t "${IMAGE}:sha-${SHORT_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:sha-${SHORT_SHA}"
          docker push "${IMAGE}:latest"

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:sha-${SHORT_SHA}" | cut -d@ -f2)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "✅ pushed ${IMAGE}:sha-${SHORT_SHA}"
          echo "   digest ${DIGEST}"

  # ── 3. deploy-dev（只有 main）──────────────────────────────────────────────
  deploy-dev:
    name: 3 deploy → dev
    if: github.ref_type == 'branch'
    needs: [verify, build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.DEV_PROJECT }}
          workload_identity_provider: projects/${{ env.DEV_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL }}/providers/${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA_ID }}@${{ env.DEV_PROJECT }}.iam.gserviceaccount.com

      - name: 確認 gcloud 可用
        run: |
          # ubuntu runner 預裝 gcloud，所以不用 setup-gcloud（那一步每個 job 要花 15~25 秒）。
          # 若哪天 runner image 拿掉了，這裡會立刻紅燈，而不是在後面噴看不懂的錯。
          command -v gcloud >/dev/null || { echo "::error::runner 沒有預裝 gcloud，請把 setup-gcloud 加回來"; exit 1; }
          gcloud --version | head -1

      - name: gcloud run deploy
        id: deploy
        env:
          SERVICE: ${{ needs.verify.outputs.service }}
          DIGEST: ${{ needs.build-push.outputs.digest }}
          REGION: ${{ needs.verify.outputs.region }}
          UNAUTH: ${{ needs.verify.outputs.allow_unauthenticated }}
          ENV_NAME: dev
          PROJECT: adamsourceinfo-dev
          DB_INSTANCE: ${{ needs.verify.outputs.db_instance }}
          DB_NAME: ${{ needs.verify.outputs.db_name }}
        run: |
          set -euo pipefail
          IMAGE="${AR_HOST}/${PROJECT}/${AR_REPO}/${SERVICE}@${DIGEST}"

          # ── 設定與機密 ────────────────────────────────────────────────
          # .cicd/env.<env>      非機密設定，KEY=VALUE，進版控
          # .cicd/secrets.<env>  只放 Secret Manager 的「名字」，KEY=secret-name:version
          # 用 ^@@^ 自訂分隔符，值裡面才可以出現逗號與 @（DB_USER 就含 @）。
          ENV_FILE=".cicd/env.${ENV_NAME}"
          SEC_FILE=".cicd/secrets.${ENV_NAME}"

          # 一律用 --update-env-vars（合併），永遠不用 --set-env-vars（取代全部）。
          # CI 只新增/更新它認得的變數，絕不刪除任何它不知道的東西 —— 你在 Cloud Run
          # 主控台設的變數不會被抹掉。
          # 代價：從 .cicd/env.<env> 刪掉一行，Cloud Run 上那個變數不會自動消失，
          # 要手動移除：gcloud run services update <svc> --remove-env-vars=KEY
          # common 先讀、環境專屬後讀 —— 同名 key 由環境專屬覆蓋。兩邊一樣的設定只寫
          # 一次就好，不用在 dev/prod 各抄一遍（抄兩遍的東西遲早會分歧）。
          merge() {
            for f in "$@"; do
              [ -f "$f" ] && { grep -vE '^[[:space:]]*(#|$)' "$f" || true; }
            done | awk -F= '
              { k=$1; v=substr($0, index($0,"=")+1)
                if (!(k in val)) order[++n]=k
                val[k]=v }
              END { for (i=1;i<=n;i++) print order[i]"="val[order[i]] }'
          }

          PAIRS="APP_ENV=${ENV_NAME}"
          [ -n "${APP_VERSION:-}" ] && PAIRS="${PAIRS}@@APP_VERSION=${APP_VERSION}"
          while IFS= read -r line; do
            if [ -n "$line" ]; then PAIRS="${PAIRS}@@${line}"; fi
          done <<< "$(merge '.cicd/env.common' "$ENV_FILE")"
          echo "已套用 .cicd/env.common + ${ENV_FILE}（合併模式，不會刪除既有變數）"

          # ── Cloud SQL ────────────────────────────────────────────────
          # DB 在 .cicd/config.yml 只宣告一次（不是 dev/prod 各一份）。連線字串與 DB 帳號
          # 由 CI 依「正在部署哪個環境」推導 —— 連錯環境不是「會被抓到」，是根本沒有
          # 欄位可以寫錯。前提：Cloud SQL 與 Cloud Run 同區域。
          if [ -n "${DB_INSTANCE:-}" ]; then
            ICN="${PROJECT}:${REGION}:${DB_INSTANCE}"
            PAIRS="${PAIRS}@@DB_INSTANCE=${DB_INSTANCE}@@DB_NAME=${DB_NAME}"
            PAIRS="${PAIRS}@@INSTANCE_CONNECTION_NAME=${ICN}@@DB_USER=${RUNTIME_SA_ID}@${PROJECT}.iam"
            echo "已推導 Cloud SQL：${ICN}（DB 帳號 ${RUNTIME_SA_ID}@${PROJECT}.iam）"
          fi

          SEC_PAIRS=""
          while IFS= read -r line; do
            if [ -n "$line" ]; then SEC_PAIRS="${SEC_PAIRS:+${SEC_PAIRS}@@}${line}"; fi
          done <<< "$(merge '.cicd/secrets.common' "$SEC_FILE")"
          if [ -n "$SEC_PAIRS" ]; then
            echo "已掛載 .cicd/secrets.common + ${SEC_FILE}（只掛名字，值留在 Secret Manager）"
          fi

          ARGS=(
            "$SERVICE"
            --image="$IMAGE"
            --region="$REGION"
            --project="$PROJECT"
            --service-account="${RUNTIME_SA_ID}@${PROJECT}.iam.gserviceaccount.com"
            --platform=managed
            --quiet
            "--update-env-vars=^@@^${PAIRS}"
          )
          if [ -n "$SEC_PAIRS" ]; then
            ARGS+=("--update-secrets=^@@^${SEC_PAIRS}")
          fi
          if [ -n "${ICN:-}" ]; then
            ARGS+=("--add-cloudsql-instances=${ICN}")
          fi
          if [ "$UNAUTH" = "true" ]; then
            ARGS+=(--allow-unauthenticated)
          else
            ARGS+=(--no-allow-unauthenticated)
          fi

          gcloud run deploy "${ARGS[@]}"

          URL=$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT" --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "✅ dev → ${URL}"

  # ── 4. smoke-dev（只有 main）───────────────────────────────────────────────
  smoke-dev:
    name: 4 smoke dev
    if: github.ref_type == 'branch'
    needs: [verify, build-push, deploy-dev]
    runs-on: ubuntu-latest
    steps:
      - name: 健康檢查
        env:
          URL: ${{ needs.deploy-dev.outputs.url }}
          HEALTH_PATH: ${{ needs.verify.outputs.health_path }}
        run: |
          set -euo pipefail
          TARGET="${URL%/}${HEALTH_PATH}"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$TARGET" || echo 000)
            echo "attempt $i: HTTP $CODE  $TARGET"
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ]; then
              echo "✅ dev 健康檢查通過"
              {
                echo "### ✅ 部署到 dev"
                echo ""
                echo "| | |"
                echo "|---|---|"
                echo "| 服務 | \`${{ needs.verify.outputs.service }}\` |"
                echo "| 環境 | \`adamsourceinfo-dev\` |"
                echo "| commit | \`${{ needs.verify.outputs.short_sha }}\` |"
                echo "| digest | \`${{ needs.build-push.outputs.digest }}\` |"
                echo "| URL | ${URL} |"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::dev 健康檢查失敗（最後一次 HTTP ${CODE}，目標 ${TARGET}）。服務部署成功但沒有回應，請檢查應用程式是否有監聽 \$PORT。"
          exit 1

  # ── 5. resolve（只有 tag）──────────────────────────────────────────────────
  # 由 tag 指向的 commit 反查 dev AR 裡對應的 digest。查不到代表這個 commit 沒走過
  # main pipeline —— 擋下來，不要用重建的方式蒙混過去。
  resolve:
    name: 5 resolve digest
    if: github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.find.outputs.digest }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.DEV_PROJECT }}
          workload_identity_provider: projects/${{ env.DEV_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL }}/providers/${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA_ID }}@${{ env.DEV_PROJECT }}.iam.gserviceaccount.com

      - name: 確認 gcloud 可用
        run: |
          # ubuntu runner 預裝 gcloud，所以不用 setup-gcloud（那一步每個 job 要花 15~25 秒）。
          # 若哪天 runner image 拿掉了，這裡會立刻紅燈，而不是在後面噴看不懂的錯。
          command -v gcloud >/dev/null || { echo "::error::runner 沒有預裝 gcloud，請把 setup-gcloud 加回來"; exit 1; }
          gcloud --version | head -1

      - name: 反查 digest
        id: find
        env:
          SERVICE: ${{ needs.verify.outputs.service }}
          SHORT_SHA: ${{ needs.verify.outputs.short_sha }}
        run: |
          set -euo pipefail
          IMAGE="${AR_HOST}/${DEV_PROJECT}/${AR_REPO}/${SERVICE}"

          DIGEST=$(gcloud artifacts docker images describe "${IMAGE}:sha-${SHORT_SHA}" \
            --format='value(image_summary.digest)' 2>/dev/null || true)

          if [ -z "$DIGEST" ]; then
            echo "::error::在 dev Artifact Registry 找不到 ${IMAGE}:sha-${SHORT_SHA}。"
            echo "::error::這個 tag 指向的 commit 從來沒有經過 main pipeline 建置。prod 只部署 dev 驗證過的 image —— 請先讓 commit 進 main、等 dev 部署成功，再打 tag。"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "✅ 找到 dev image digest ${DIGEST}"

  # ── 6. promote（只有 tag）─────────────────────────────────────────────────
  # 把 dev AR 的同一個 digest 搬進 prod AR。兩個 AR 都在同一個 registry host，
  # imagetools 走 cross-repo blob mount，不會真的重傳 layer。
  promote:
    name: 6 promote → prod AR
    if: github.ref_type == 'tag'
    needs: [verify, resolve]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.copy.outputs.digest }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROD_PROJECT }}
          workload_identity_provider: projects/${{ env.PROD_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL }}/providers/${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA_ID }}@${{ env.PROD_PROJECT }}.iam.gserviceaccount.com

      - name: 確認 gcloud 可用
        run: |
          # ubuntu runner 預裝 gcloud，所以不用 setup-gcloud（那一步每個 job 要花 15~25 秒）。
          # 若哪天 runner image 拿掉了，這裡會立刻紅燈，而不是在後面噴看不懂的錯。
          command -v gcloud >/dev/null || { echo "::error::runner 沒有預裝 gcloud，請把 setup-gcloud 加回來"; exit 1; }
          gcloud --version | head -1

      - name: 安裝 crane
        env:
          CRANE_VERSION: v0.20.2
        run: |
          set -euo pipefail
          # 用 crane 而不是 docker buildx imagetools create —— 後者會把來源 manifest 再包
          # 一層 index，digest 就變了。promote 的整個重點是 digest 原封不動，所以只能用
          # 真正的 copy。
          cd /tmp
          curl -fsSL -o crane.tar.gz \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          tar -xzf crane.tar.gz crane
          sudo mv crane /usr/local/bin/crane
          crane version

      - name: 複製 image 並比對 digest
        id: copy
        env:
          SERVICE: ${{ needs.verify.outputs.service }}
          SRC_DIGEST: ${{ needs.resolve.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SRC="${AR_HOST}/${DEV_PROJECT}/${AR_REPO}/${SERVICE}@${SRC_DIGEST}"
          DST="${AR_HOST}/${PROD_PROJECT}/${AR_REPO}/${SERVICE}"

          gcloud auth print-access-token \
            | crane auth login -u oauth2accesstoken --password-stdin "${AR_HOST}"

          crane copy "$SRC" "${DST}:${TAG}"
          crane tag "${DST}:${TAG}" latest

          NEW_DIGEST=$(gcloud artifacts docker images describe "${DST}:${TAG}" --format='value(image_summary.digest)')
          if [ "$NEW_DIGEST" != "$SRC_DIGEST" ]; then
            echo "::error::複製後 digest 不一致：來源 ${SRC_DIGEST} → 目的 ${NEW_DIGEST}。promote 的整個重點就是逐位元組相同，這裡不一致就必須中止。"
            exit 1
          fi
          echo "digest=${NEW_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "✅ promote 完成，digest 一致：${NEW_DIGEST}"

  # ── 7. deploy-prod（只有 tag）─────────────────────────────────────────────
  deploy-prod:
    name: 7 deploy → prod
    if: github.ref_type == 'tag'
    needs: [verify, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: prod
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROD_PROJECT }}
          workload_identity_provider: projects/${{ env.PROD_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL }}/providers/${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA_ID }}@${{ env.PROD_PROJECT }}.iam.gserviceaccount.com

      - name: 確認 gcloud 可用
        run: |
          # ubuntu runner 預裝 gcloud，所以不用 setup-gcloud（那一步每個 job 要花 15~25 秒）。
          # 若哪天 runner image 拿掉了，這裡會立刻紅燈，而不是在後面噴看不懂的錯。
          command -v gcloud >/dev/null || { echo "::error::runner 沒有預裝 gcloud，請把 setup-gcloud 加回來"; exit 1; }
          gcloud --version | head -1

      - name: gcloud run deploy
        id: deploy
        env:
          SERVICE: ${{ needs.verify.outputs.service }}
          DIGEST: ${{ needs.promote.outputs.digest }}
          REGION: ${{ needs.verify.outputs.region }}
          UNAUTH: ${{ needs.verify.outputs.allow_unauthenticated }}
          APP_VERSION: ${{ github.ref_name }}
          ENV_NAME: prod
          PROJECT: adamsourceinfo-prod
          DB_INSTANCE: ${{ needs.verify.outputs.db_instance }}
          DB_NAME: ${{ needs.verify.outputs.db_name }}
        run: |
          set -euo pipefail
          IMAGE="${AR_HOST}/${PROJECT}/${AR_REPO}/${SERVICE}@${DIGEST}"

          # ── 設定與機密 ────────────────────────────────────────────────
          # .cicd/env.<env>      非機密設定，KEY=VALUE，進版控
          # .cicd/secrets.<env>  只放 Secret Manager 的「名字」，KEY=secret-name:version
          # 用 ^@@^ 自訂分隔符，值裡面才可以出現逗號與 @（DB_USER 就含 @）。
          ENV_FILE=".cicd/env.${ENV_NAME}"
          SEC_FILE=".cicd/secrets.${ENV_NAME}"

          # 一律用 --update-env-vars（合併），永遠不用 --set-env-vars（取代全部）。
          # CI 只新增/更新它認得的變數，絕不刪除任何它不知道的東西 —— 你在 Cloud Run
          # 主控台設的變數不會被抹掉。
          # 代價：從 .cicd/env.<env> 刪掉一行，Cloud Run 上那個變數不會自動消失，
          # 要手動移除：gcloud run services update <svc> --remove-env-vars=KEY
          # common 先讀、環境專屬後讀 —— 同名 key 由環境專屬覆蓋。兩邊一樣的設定只寫
          # 一次就好，不用在 dev/prod 各抄一遍（抄兩遍的東西遲早會分歧）。
          merge() {
            for f in "$@"; do
              [ -f "$f" ] && { grep -vE '^[[:space:]]*(#|$)' "$f" || true; }
            done | awk -F= '
              { k=$1; v=substr($0, index($0,"=")+1)
                if (!(k in val)) order[++n]=k
                val[k]=v }
              END { for (i=1;i<=n;i++) print order[i]"="val[order[i]] }'
          }

          PAIRS="APP_ENV=${ENV_NAME}"
          [ -n "${APP_VERSION:-}" ] && PAIRS="${PAIRS}@@APP_VERSION=${APP_VERSION}"
          while IFS= read -r line; do
            if [ -n "$line" ]; then PAIRS="${PAIRS}@@${line}"; fi
          done <<< "$(merge '.cicd/env.common' "$ENV_FILE")"
          echo "已套用 .cicd/env.common + ${ENV_FILE}（合併模式，不會刪除既有變數）"

          # ── Cloud SQL ────────────────────────────────────────────────
          # DB 在 .cicd/config.yml 只宣告一次（不是 dev/prod 各一份）。連線字串與 DB 帳號
          # 由 CI 依「正在部署哪個環境」推導 —— 連錯環境不是「會被抓到」，是根本沒有
          # 欄位可以寫錯。前提：Cloud SQL 與 Cloud Run 同區域。
          if [ -n "${DB_INSTANCE:-}" ]; then
            ICN="${PROJECT}:${REGION}:${DB_INSTANCE}"
            PAIRS="${PAIRS}@@DB_INSTANCE=${DB_INSTANCE}@@DB_NAME=${DB_NAME}"
            PAIRS="${PAIRS}@@INSTANCE_CONNECTION_NAME=${ICN}@@DB_USER=${RUNTIME_SA_ID}@${PROJECT}.iam"
            echo "已推導 Cloud SQL：${ICN}（DB 帳號 ${RUNTIME_SA_ID}@${PROJECT}.iam）"
          fi

          SEC_PAIRS=""
          while IFS= read -r line; do
            if [ -n "$line" ]; then SEC_PAIRS="${SEC_PAIRS:+${SEC_PAIRS}@@}${line}"; fi
          done <<< "$(merge '.cicd/secrets.common' "$SEC_FILE")"
          if [ -n "$SEC_PAIRS" ]; then
            echo "已掛載 .cicd/secrets.common + ${SEC_FILE}（只掛名字，值留在 Secret Manager）"
          fi

          ARGS=(
            "$SERVICE"
            --image="$IMAGE"
            --region="$REGION"
            --project="$PROJECT"
            --service-account="${RUNTIME_SA_ID}@${PROJECT}.iam.gserviceaccount.com"
            --platform=managed
            --quiet
            "--update-env-vars=^@@^${PAIRS}"
          )
          if [ -n "$SEC_PAIRS" ]; then
            ARGS+=("--update-secrets=^@@^${SEC_PAIRS}")
          fi
          if [ -n "${ICN:-}" ]; then
            ARGS+=("--add-cloudsql-instances=${ICN}")
          fi
          if [ "$UNAUTH" = "true" ]; then
            ARGS+=(--allow-unauthenticated)
          else
            ARGS+=(--no-allow-unauthenticated)
          fi

          gcloud run deploy "${ARGS[@]}"

          URL=$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT" --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "✅ prod → ${URL}"

  # ── 8. smoke-prod（只有 tag）──────────────────────────────────────────────
  smoke-prod:
    name: 8 smoke prod
    if: github.ref_type == 'tag'
    needs: [verify, resolve, promote, deploy-prod]
    runs-on: ubuntu-latest
    steps:
      - name: 健康檢查
        env:
          URL: ${{ needs.deploy-prod.outputs.url }}
          HEALTH_PATH: ${{ needs.verify.outputs.health_path }}
        run: |
          set -euo pipefail
          TARGET="${URL%/}${HEALTH_PATH}"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$TARGET" || echo 000)
            echo "attempt $i: HTTP $CODE  $TARGET"
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ]; then
              echo "✅ prod 健康檢查通過"
              {
                echo "### 🚀 發布到 prod"
                echo ""
                echo "| | |"
                echo "|---|---|"
                echo "| 服務 | \`${{ needs.verify.outputs.service }}\` |"
                echo "| 版本 | \`${{ github.ref_name }}\` |"
                echo "| 環境 | \`adamsourceinfo-prod\` |"
                echo "| commit | \`${{ needs.verify.outputs.short_sha }}\` |"
                echo "| digest | \`${{ needs.promote.outputs.digest }}\` |"
                echo "| URL | ${URL} |"
                echo ""
                echo "此 digest 與 dev 驗證過的 image 完全相同（未重新 build）。"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::prod 健康檢查失敗（最後一次 HTTP ${CODE}，目標 ${TARGET}）。"
          exit 1
