# adamsourceinfo-org 共用部署流程。各專案只放一支 caller stub 呼叫這裡。
#
# 改你自己 repo 的 workflow 不會讓你拿到任何 GCP 權限 —— 換取雲端憑證的條件綁死在
# "adamsourceinfo-org/ci/.github/workflows/deploy.yml@refs/heads/main"。從別的 workflow 呼叫換不到。
#
# 兩條路：
#   push main → 部署 adamsourceinfo-dev
#   push tag  → 把 main 建好的「同一個 image digest」搬到 adamsourceinfo-prod 部署
#
# tag 永遠不重新 build。prod 跑的 binary 逐位元組等於 dev 驗過的那一份。
name: deploy (reusable)

on:
  workflow_call:
    inputs:
      service:
        description: "Cloud Run 服務名稱。留空則用 caller repo 名稱"
        type: string
        required: false
        default: ""
      region:
        description: "Cloud Run 區域"
        type: string
        required: false
        default: asia-east1
      health_path:
        description: "smoke test 打的路徑"
        type: string
        required: false
        default: "/"
      dockerfile:
        description: "Dockerfile 路徑"
        type: string
        required: false
        default: Dockerfile
      allow_unauthenticated:
        description: "是否開放未驗證存取"
        type: boolean
        required: false
        default: true

env:
  DEV_PROJECT: adamsourceinfo-dev
  DEV_PROJECT_NUMBER: "606393814183"
  PROD_PROJECT: adamsourceinfo-prod
  PROD_PROJECT_NUMBER: "197982716696"
  AR_HOST: asia-east1-docker.pkg.dev
  AR_REPO: apps
  WIF_POOL: github
  WIF_PROVIDER: adamsourceinfo-org
  DEPLOYER_SA_ID: github-deployer
  # 沒有自己資料庫的服務用這個共用執行身分。要用 DB 就必須在
  # .cicd/config.yml 宣告自己的 runtime_sa —— 這個共用身分沒有 Cloud SQL 權限。
  RUNTIME_SA_ID: run-runtime
  # 一個環境一台，服務靠 database 分隔。instance 由平台決定，
  # 專案端沒有這個欄位可以寫錯。
  SQL_INSTANCE: apps-pg

jobs:
  # ── 1. verify ──────────────────────────────────────────────────────────────
  # 契約檢查。tag 另外驗格式，並確認它指向 main 上的 commit —— 否則 prod 會部署到
  # 從沒經過 dev 的程式碼。
  verify:
    name: 1 verify
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.contract.outputs.service }}
      short_sha: ${{ steps.contract.outputs.short_sha }}
      region: ${{ steps.contract.outputs.region }}
      health_path: ${{ steps.contract.outputs.health_path }}
      dockerfile: ${{ steps.contract.outputs.dockerfile }}
      allow_unauthenticated: ${{ steps.contract.outputs.allow_unauthenticated }}
      runtime_sa: ${{ steps.contract.outputs.runtime_sa }}
      db_name: ${{ steps.contract.outputs.db_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 檢查契約
        id: contract
        env:
          IN_SERVICE: ${{ inputs.service }}
          IN_REGION: ${{ inputs.region }}
          IN_HEALTH_PATH: ${{ inputs.health_path }}
          IN_DOCKERFILE: ${{ inputs.dockerfile }}
          IN_UNAUTH: ${{ inputs.allow_unauthenticated }}
        run: |
          set -euo pipefail

          # ── .cicd/config.yml ─────────────────────────────────────────
          # 專案的結構性設定收在這一份。沒有這個檔就全部退回 stub 的 with: 參數，
          # 所以既有專案不改任何東西也照跑。yq 是 ubuntu runner 預裝的。
          CFG=".cicd/config.yml"
          if [ -f "$CFG" ]; then
            command -v yq >/dev/null || { echo "::error::runner 沒有 yq，無法解析 ${CFG}"; exit 1; }
            yq -e 'type == "!!map"' "$CFG" >/dev/null 2>&1 || {
              echo "::error::${CFG} 必須是 YAML mapping（key: value）。"; exit 1; }

            # 擋掉打錯的 key —— 設定檔最常見的失敗是「明明寫了卻沒生效」。
            ALLOWED="service region health_path dockerfile allow_unauthenticated runtime_sa db"
            for K in $(yq -r 'keys | .[]' "$CFG"); do
              case " $ALLOWED " in
                *" $K "*) ;;
                *) echo "::error::${CFG} 有不認得的設定 '${K}'。可用的是：${ALLOWED}"; exit 1 ;;
              esac
            done
            for K in $(yq -r '.db // {} | keys | .[]' "$CFG"); do
              case "$K" in
                name) ;;
                instance)
                  # 一個環境一台，instance 由平台決定。給明確的遷移訊息，
                  # 不要讓它掉進「不認得的設定」那個泛用錯誤。
                  echo "::error::${CFG} 的 db.instance 已移除 —— instance 現在由平台決定"
                  echo "::error::（一個環境一台，服務靠 database 分隔）。請刪掉這一行，只留 db.name。"
                  exit 1 ;;
                *) echo "::error::${CFG} 的 db 底下有不認得的設定 '${K}'。可用的是：name"; exit 1 ;;
              esac
            done
          fi

          cfg() {  # cfg <yq 路徑> <退回值>
            local v=""
            if [ -f "$CFG" ]; then
              # 刻意不用 yq 的 // 運算子：它把 false 也當成「空值」，
              # allow_unauthenticated: false 會被吃掉、退回預設的 true —— 服務靜靜變公開。
              # 不吞錯誤：yq 失敗代表 config.yml 有問題，要大聲停下來，不是退回預設值。
              v="$(yq -r "$1" "$CFG")"
              [ "$v" = "null" ] && v=""
            fi
            printf '%s' "${v:-$2}"
          }

          SERVICE="$(cfg '.service' "${IN_SERVICE:-${GITHUB_REPOSITORY##*/}}")"
          REGION="$(cfg '.region' "$IN_REGION")"
          HEALTH_PATH="$(cfg '.health_path' "$IN_HEALTH_PATH")"
          DOCKERFILE="$(cfg '.dockerfile' "$IN_DOCKERFILE")"
          UNAUTH="$(cfg '.allow_unauthenticated' "$IN_UNAUTH")"
          DB_NAME="$(cfg '.db.name' '')"
          RUNTIME_SA="$(cfg '.runtime_sa' "$RUNTIME_SA_ID")"

          # 共用的 run-runtime 刻意沒有 Cloud SQL 權限 —— 要用 DB 就要有自己的身分。
          # 擋在這裡，否則會變成部署成功、上線才發現連不上。
          if [ -n "$DB_NAME" ] && [ "$RUNTIME_SA" = "$RUNTIME_SA_ID" ]; then
            echo "::error::${CFG} 宣告了 db 就必須指定 runtime_sa —— 共用的 ${RUNTIME_SA_ID} 沒有 Cloud SQL 權限。"
            echo "::error::  runtime_sa: run-<服務名>"
            exit 1
          fi
          # SA ID 的規則比 Cloud Run 服務名嚴格：6-30 字元。先擋掉，不然錯誤會在部署時才浮現。
          if ! printf '%s' "$RUNTIME_SA" | grep -Eq '^[a-z][-a-z0-9]{4,28}[a-z0-9]$'; then
            echo "::error::runtime_sa '${RUNTIME_SA}' 不是合法的 service account ID（6-30 字元，小寫字母開頭，只能有小寫字母/數字/連字號）。"
            exit 1
          fi
          if ! printf '%s' "$SERVICE" | grep -Eq '^[a-z]([-a-z0-9]*[a-z0-9])?$'; then
            echo "::error::服務名稱 '$SERVICE' 不符合 Cloud Run 規則（小寫字母開頭，只能有小寫字母/數字/連字號）。請在 stub 用 service: 指定合法名稱。"
            exit 1
          fi
          if [ ${#SERVICE} -gt 49 ]; then
            echo "::error::服務名稱 '$SERVICE' 超過 49 字元。"
            exit 1
          fi

          if [ ! -f "$DOCKERFILE" ]; then
            echo "::error::找不到 ${DOCKERFILE}。adamsourceinfo-org 的部署契約要求每個專案自備 Dockerfile。"
            exit 1
          fi

          {
            echo "service=$SERVICE"
            echo "short_sha=${GITHUB_SHA:0:7}"
            echo "region=$REGION"
            echo "health_path=$HEALTH_PATH"
            echo "dockerfile=$DOCKERFILE"
            echo "allow_unauthenticated=$UNAUTH"
            echo "runtime_sa=$RUNTIME_SA"
            echo "db_name=$DB_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "✅ service=$SERVICE  region=$REGION  dockerfile=$DOCKERFILE  sha=${GITHUB_SHA:0:7}"
          [ -n "$DB_NAME" ] && echo "   Cloud SQL：${SQL_INSTANCE} / ${DB_NAME}（執行身分 ${RUNTIME_SA}）"

      - name: 檢查 .cicd 設定契約
        run: |
          set -euo pipefail

          for f in .cicd/env.common .cicd/env.dev .cicd/env.prod \
                   .cicd/secrets.common .cicd/secrets.dev .cicd/secrets.prod; do
            [ -f "$f" ] || continue
            if grep -vE '^\s*(#|$)' "$f" | grep -qvE '^[A-Za-z_][A-Za-z0-9_]*='; then
              echo "::error::$f 有不合法的行。格式必須是 KEY=VALUE，一行一個。"
              exit 1
            fi
          done

          for f in .cicd/secrets.common .cicd/secrets.dev .cicd/secrets.prod; do
            [ -f "$f" ] || continue
            if grep -vE '^\s*(#|$)' "$f" | grep -qvE '^[A-Za-z_][A-Za-z0-9_]*=[a-z0-9][a-z0-9_-]*:(latest|[0-9]+)$'; then
              echo "::error::$f 格式錯誤。這個檔案只能放 Secret Manager 的『名字』，不能放值："
              echo "::error::  正確 → DB_PASSWORD=myapp-db-password-dev:latest"
              echo "::error::  錯誤 → DB_PASSWORD=hunter2"
              exit 1
            fi
          done

          # INSTANCE_CONNECTION_NAME / DB_USER 由 CI 依部署目標推導後注入；
          # DB_NAME 宣告在 .cicd/config.yml（只寫一次）；DB_INSTANCE 已經完全廢除
          # —— instance 由平台的 SQL_INSTANCE 決定，專案端沒有這個概念。
          # 這些出現在 env 檔裡會跟注入值撞名，誰贏未定義 —— 擋下來比安靜地不確定好。
          for F in .cicd/env.common .cicd/env.dev .cicd/env.prod; do
            [ -f "$F" ] || continue
            for KEY in INSTANCE_CONNECTION_NAME DB_USER; do
              if grep -Eq "^[[:space:]]*${KEY}=" "$F"; then
                echo "::error::${F} 不可以自己設定 ${KEY} —— 這個值由 CI 依部署目標推導。"
                echo "::error::請在 .cicd/config.yml 宣告 db.name 與 runtime_sa。"
                exit 1
              fi
            done
            for KEY in DB_INSTANCE DB_NAME; do
              if grep -Eq "^[[:space:]]*${KEY}=" "$F"; then
                echo "::error::${F} 的 ${KEY} 要搬到 .cicd/config.yml —— 那裡只宣告一次，不會 dev/prod 分歧："
                echo "::error::  db:"
                echo "::error::    name: <database 名稱>   # instance 由平台決定，不用寫"
                exit 1
              fi
            done
          done

          echo "✅ .cicd 設定契約檢查通過"

      - name: 驗證 tag（僅 tag 觸發）
        if: github.event_name != 'pull_request' && github.ref_type == 'tag'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$TAG' 格式不對。正式發布的 tag 必須是 vMAJOR.MINOR.PATCH，例如 v1.0.3。"
            echo "::error::（本 workflow 刻意接收所有 tag 再在這裡擋下來。用 glob 過濾的話，格式錯的 tag 會安靜地什麼都不發生，比紅燈難查得多。）"
            exit 1
          fi

          if ! git branch -r --contains "$GITHUB_SHA" | grep -qE '^\s*origin/main$'; then
            echo "::error::tag '$TAG' 指向的 commit ($GITHUB_SHA) 不在 main 上。"
            echo "::error::prod 只部署 main 驗證過的 image。請把 commit 併進 main 之後再打 tag。"
            exit 1
          fi
          echo "✅ tag $TAG 格式正確且指向 main"

  # ── 2. build-push（只有 main）───────────────────────────────────────────────
  # ── PR 專用：只證明建得起來，完全不碰 GCP ─────────────────────────────────
  # 這個 job 刻意「沒有」permissions: id-token: write —— PR 的程式碼拿不到、也換不到
  # 任何雲端憑證。合併 ci.yml 進來之後，這條界線只剩下面這個 if: 和缺席的 permissions
  # 在守，所以它們是安全邊界的一部分，不是風格。
  build:
    name: 2 build
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build（不推）
        env:
          DOCKERFILE: ${{ needs.verify.outputs.dockerfile }}
        run: |
          set -euo pipefail
          docker build -f "$DOCKERFILE" -t "ci-check:${GITHUB_SHA:0:7}" .
          echo "✅ image 建置成功"
  # ── 1.5 preflight ─────────────────────────────────────────────────────────
  # 在 build 之前確認 GCP 那邊的一次性資源都到位。沒有這個 job 的話，缺一個 SA
  # 會先白跑 36 秒的 build、把一個 image 永久留在 AR，才在部署那步撞牆（實測）。
  #
  # 只查「部署身分本來就看得到」的三項。角色綁定 / DB user / GRANT 查不到 ——
  # 那需要 getIamPolicy 與 cloudsql.users.list，刻意不為此擴權，因為那會侵蝕
  # 「部署身分沒有 iam.*」這條線。那三項由 ci/scripts/provision-service.sh
  # 在人這一端驗（人的憑證查得到）。
  #
  # 刻意不順便檢查另一個環境：這個 job 拿的是本環境的憑證，看不到另一個專案，
  # 加上去只會變成每次都警告，而每次都出現的警告等於沒有警告。「prod 忘了
  # provision」的根因由 provision-service.sh 預設就做兩個環境解決。
  #
  # job 層只擋 PR（與其他碰 GCP 的 job 一致）；不用 DB 的服務改在 step 層跳過，
  # 這樣下游的 needs 就不必寫 always() 那套條件體操。
  preflight:
    name: 1.5 preflight
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_PROJECT: ${{ github.ref_type == 'tag' && 'adamsourceinfo-prod' || 'adamsourceinfo-dev' }}
      TARGET_NUMBER: ${{ github.ref_type == 'tag' && '197982716696' || '606393814183' }}
    steps:
      - uses: google-github-actions/auth@v2
        if: needs.verify.outputs.db_name != ''
        with:
          project_id: ${{ env.TARGET_PROJECT }}
          workload_identity_provider: projects/${{ env.TARGET_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL }}/providers/${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA_ID }}@${{ env.TARGET_PROJECT }}.iam.gserviceaccount.com

      - name: 檢查一次性資源
        if: needs.verify.outputs.db_name != ''
        env:
          PROJECT: ${{ env.TARGET_PROJECT }}
          SERVICE: ${{ needs.verify.outputs.service }}
          RUNTIME_SA: ${{ needs.verify.outputs.runtime_sa }}
          DB_NAME: ${{ needs.verify.outputs.db_name }}
        run: |
          set -uo pipefail
          command -v gcloud >/dev/null || { echo "::error::runner 沒有預裝 gcloud"; exit 1; }
          MISSING=0

          # 把 stderr 收下來再判斷 ——「查不到」和「不存在」是兩件事。
          # 印成同一句話會把人帶往完全錯的方向：實測 iam.googleapis.com 沒開時，
          # 訊息說「找不到執行身分」但那個 SA 明明存在，而且專案 owner 自己
          # 呼叫得動，所以手動驗證完全重現不出來。
          probe() {  # probe <描述> <補救提示> <指令...>
            local what="$1" hint="$2"; shift 2
            local err api
            if err="$("$@" 2>&1 >/dev/null)"; then return 0; fi
            if printf '%s' "$err" | grep -qE 'SERVICE_DISABLED|has not been used in project|it is disabled'; then
              # API 名字通常藏在錯誤裡的 console URL（…/apis/api/<name>/overview）。
              api="$(printf '%s' "$err" | grep -oE '[a-z][a-z0-9-]*\.googleapis\.com' | head -1)"
              if [ -n "$api" ]; then
                echo "::error::查不到${what} —— ${PROJECT} 沒有啟用 ${api}："
                echo "::error::  gcloud services enable ${api} --project=${PROJECT}"
              else
                # 解析不出名字就把原文吐出來。吞掉線索正是這個 probe 要修的問題本身。
                echo "::error::查不到${what} —— ${PROJECT} 有 API 未啟用，但解析不出名稱。原文："
                printf '%s\n' "$err" | head -3 | sed 's/^/::error::  /'
              fi
            else
              echo "::error::${PROJECT} 找不到${what}。${hint}"
              # 非預期的錯誤（權限、網路）也要看得到，不然又是一句話打發兩種病因。
              printf '%s' "$err" | grep -qiE 'not found|does not exist|NOT_FOUND' \
                || printf '%s\n' "$err" | head -2 | sed 's/^/::error::  /'
            fi
            MISSING=1
          }

          # 三項全部跑完再回報 —— 撞到第一個就 exit 會讓人來回三趟。
          probe "共用 Cloud SQL instance「${SQL_INSTANCE}」" \
                "見 ci/README.md「開共用 instance」。" \
                gcloud sql instances describe "$SQL_INSTANCE" --project="$PROJECT"

          probe "database「${DB_NAME}」" \
                "跑 ci/scripts/provision-service.sh。" \
                gcloud sql databases describe "$DB_NAME" --instance="$SQL_INSTANCE" --project="$PROJECT"

          probe "執行身分「${RUNTIME_SA}」" \
                "跑 ci/scripts/provision-service.sh。" \
                gcloud iam service-accounts describe \
                  "${RUNTIME_SA}@${PROJECT}.iam.gserviceaccount.com" --project="$PROJECT"

          if [ "$MISSING" -ne 0 ]; then
            echo "::error::一次性資源不齊，停在 build 之前。一次補齊（會做兩個環境）："
            echo "::error::  ci/scripts/provision-service.sh ${SERVICE} ${RUNTIME_SA} ${DB_NAME}"
            exit 1
          fi
          echo "✅ ${PROJECT}：instance / database / 執行身分都在"

      - name: 這個服務不用 DB
        if: needs.verify.outputs.db_name == ''
        run: echo "沒有宣告 db，略過 GCP 前置檢查（執行身分會退回共用的 run-runtime）"



  build-push:
    name: 2 build-push → dev AR
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    needs: [verify, preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.DEV_PROJECT }}
          workload_identity_provider: projects/${{ env.DEV_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL }}/providers/${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA_ID }}@${{ env.DEV_PROJECT }}.iam.gserviceaccount.com

      - name: 確認 gcloud 可用
        run: |
          # ubuntu runner 預裝 gcloud，所以不用 setup-gcloud（那一步每個 job 要花 15~25 秒）。
          # 若哪天 runner image 拿掉了，這裡會立刻紅燈，而不是在後面噴看不懂的錯。
          command -v gcloud >/dev/null || { echo "::error::runner 沒有預裝 gcloud，請把 setup-gcloud 加回來"; exit 1; }
          gcloud --version | head -1

      - name: docker 登入 Artifact Registry
        run: gcloud auth configure-docker "${AR_HOST}" --quiet

      - name: build & push
        id: push
        env:
          SERVICE: ${{ needs.verify.outputs.service }}
          SHORT_SHA: ${{ needs.verify.outputs.short_sha }}
          DOCKERFILE: ${{ needs.verify.outputs.dockerfile }}
        run: |
          set -euo pipefail
          IMAGE="${AR_HOST}/${DEV_PROJECT}/${AR_REPO}/${SERVICE}"

          docker build -f "$DOCKERFILE" -t "${IMAGE}:sha-${SHORT_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:sha-${SHORT_SHA}"
          docker push "${IMAGE}:latest"

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:sha-${SHORT_SHA}" | cut -d@ -f2)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "✅ pushed ${IMAGE}:sha-${SHORT_SHA}"
          echo "   digest ${DIGEST}"

  # ── 3. deploy-dev（只有 main）──────────────────────────────────────────────
  deploy-dev:
    name: 3 deploy → dev
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    needs: [verify, build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.DEV_PROJECT }}
          workload_identity_provider: projects/${{ env.DEV_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL }}/providers/${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA_ID }}@${{ env.DEV_PROJECT }}.iam.gserviceaccount.com

      - name: 確認 gcloud 可用
        run: |
          # ubuntu runner 預裝 gcloud，所以不用 setup-gcloud（那一步每個 job 要花 15~25 秒）。
          # 若哪天 runner image 拿掉了，這裡會立刻紅燈，而不是在後面噴看不懂的錯。
          command -v gcloud >/dev/null || { echo "::error::runner 沒有預裝 gcloud，請把 setup-gcloud 加回來"; exit 1; }
          gcloud --version | head -1

      - name: 部署
        id: deploy
        uses: adamsourceinfo-org/ci/.github/actions/deploy-service@main
        with:
          service: ${{ needs.verify.outputs.service }}
          digest: ${{ needs.build-push.outputs.digest }}
          region: ${{ needs.verify.outputs.region }}
          project: ${{ env.DEV_PROJECT }}
          env_name: dev
          allow_unauthenticated: ${{ needs.verify.outputs.allow_unauthenticated }}
          runtime_sa: ${{ needs.verify.outputs.runtime_sa }}
          db_name: ${{ needs.verify.outputs.db_name }}
          ar_host: ${{ env.AR_HOST }}
          ar_repo: ${{ env.AR_REPO }}
          sql_instance: ${{ env.SQL_INSTANCE }}

  # ── 4. smoke-dev（只有 main）───────────────────────────────────────────────
  smoke-dev:
    name: 4 smoke dev
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    needs: [verify, build-push, deploy-dev]
    runs-on: ubuntu-latest
    steps:
      - name: 健康檢查
        env:
          URL: ${{ needs.deploy-dev.outputs.url }}
          HEALTH_PATH: ${{ needs.verify.outputs.health_path }}
        run: |
          set -euo pipefail
          TARGET="${URL%/}${HEALTH_PATH}"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$TARGET" || echo 000)
            echo "attempt $i: HTTP $CODE  $TARGET"
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ]; then
              echo "✅ dev 健康檢查通過"
              {
                echo "### ✅ 部署到 dev"
                echo ""
                echo "| | |"
                echo "|---|---|"
                echo "| 服務 | \`${{ needs.verify.outputs.service }}\` |"
                echo "| 環境 | \`adamsourceinfo-dev\` |"
                echo "| commit | \`${{ needs.verify.outputs.short_sha }}\` |"
                echo "| digest | \`${{ needs.build-push.outputs.digest }}\` |"
                echo "| URL | ${URL} |"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::dev 健康檢查失敗（最後一次 HTTP ${CODE}，目標 ${TARGET}）。服務部署成功但沒有回應，請檢查應用程式是否有監聽 \$PORT。"
          exit 1

  # ── 5. resolve（只有 tag）──────────────────────────────────────────────────
  # 由 tag 指向的 commit 反查 dev AR 裡對應的 digest。查不到代表這個 commit 沒走過
  # main pipeline —— 擋下來，不要用重建的方式蒙混過去。
  resolve:
    name: 5 resolve digest
    if: github.event_name != 'pull_request' && github.ref_type == 'tag'
    needs: [verify, preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.find.outputs.digest }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.DEV_PROJECT }}
          workload_identity_provider: projects/${{ env.DEV_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL }}/providers/${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA_ID }}@${{ env.DEV_PROJECT }}.iam.gserviceaccount.com

      - name: 確認 gcloud 可用
        run: |
          # ubuntu runner 預裝 gcloud，所以不用 setup-gcloud（那一步每個 job 要花 15~25 秒）。
          # 若哪天 runner image 拿掉了，這裡會立刻紅燈，而不是在後面噴看不懂的錯。
          command -v gcloud >/dev/null || { echo "::error::runner 沒有預裝 gcloud，請把 setup-gcloud 加回來"; exit 1; }
          gcloud --version | head -1

      - name: 反查 digest
        id: find
        env:
          SERVICE: ${{ needs.verify.outputs.service }}
          SHORT_SHA: ${{ needs.verify.outputs.short_sha }}
        run: |
          set -euo pipefail
          IMAGE="${AR_HOST}/${DEV_PROJECT}/${AR_REPO}/${SERVICE}"

          DIGEST=$(gcloud artifacts docker images describe "${IMAGE}:sha-${SHORT_SHA}" \
            --format='value(image_summary.digest)' 2>/dev/null || true)

          if [ -z "$DIGEST" ]; then
            echo "::error::在 dev Artifact Registry 找不到 ${IMAGE}:sha-${SHORT_SHA}。"
            echo "::error::這個 tag 指向的 commit 從來沒有經過 main pipeline 建置。prod 只部署 dev 驗證過的 image —— 請先讓 commit 進 main、等 dev 部署成功，再打 tag。"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "✅ 找到 dev image digest ${DIGEST}"

  # ── 6. promote（只有 tag）─────────────────────────────────────────────────
  # 把 dev AR 的同一個 digest 搬進 prod AR。兩個 AR 都在同一個 registry host，
  # imagetools 走 cross-repo blob mount，不會真的重傳 layer。
  promote:
    name: 6 promote → prod AR
    if: github.event_name != 'pull_request' && github.ref_type == 'tag'
    needs: [verify, resolve]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.copy.outputs.digest }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROD_PROJECT }}
          workload_identity_provider: projects/${{ env.PROD_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL }}/providers/${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA_ID }}@${{ env.PROD_PROJECT }}.iam.gserviceaccount.com

      - name: 確認 gcloud 可用
        run: |
          # ubuntu runner 預裝 gcloud，所以不用 setup-gcloud（那一步每個 job 要花 15~25 秒）。
          # 若哪天 runner image 拿掉了，這裡會立刻紅燈，而不是在後面噴看不懂的錯。
          command -v gcloud >/dev/null || { echo "::error::runner 沒有預裝 gcloud，請把 setup-gcloud 加回來"; exit 1; }
          gcloud --version | head -1

      - name: 安裝 crane
        env:
          CRANE_VERSION: v0.20.2
        run: |
          set -euo pipefail
          # 用 crane 而不是 docker buildx imagetools create —— 後者會把來源 manifest 再包
          # 一層 index，digest 就變了。promote 的整個重點是 digest 原封不動，所以只能用
          # 真正的 copy。
          cd /tmp
          curl -fsSL -o crane.tar.gz \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          tar -xzf crane.tar.gz crane
          sudo mv crane /usr/local/bin/crane
          crane version

      - name: 複製 image 並比對 digest
        id: copy
        env:
          SERVICE: ${{ needs.verify.outputs.service }}
          SRC_DIGEST: ${{ needs.resolve.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SRC="${AR_HOST}/${DEV_PROJECT}/${AR_REPO}/${SERVICE}@${SRC_DIGEST}"
          DST="${AR_HOST}/${PROD_PROJECT}/${AR_REPO}/${SERVICE}"

          gcloud auth print-access-token \
            | crane auth login -u oauth2accesstoken --password-stdin "${AR_HOST}"

          crane copy "$SRC" "${DST}:${TAG}"
          crane tag "${DST}:${TAG}" latest

          NEW_DIGEST=$(gcloud artifacts docker images describe "${DST}:${TAG}" --format='value(image_summary.digest)')
          if [ "$NEW_DIGEST" != "$SRC_DIGEST" ]; then
            echo "::error::複製後 digest 不一致：來源 ${SRC_DIGEST} → 目的 ${NEW_DIGEST}。promote 的整個重點就是逐位元組相同，這裡不一致就必須中止。"
            exit 1
          fi
          echo "digest=${NEW_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "✅ promote 完成，digest 一致：${NEW_DIGEST}"

  # ── 7. deploy-prod（只有 tag）─────────────────────────────────────────────
  deploy-prod:
    name: 7 deploy → prod
    if: github.event_name != 'pull_request' && github.ref_type == 'tag'
    needs: [verify, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: prod
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROD_PROJECT }}
          workload_identity_provider: projects/${{ env.PROD_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL }}/providers/${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA_ID }}@${{ env.PROD_PROJECT }}.iam.gserviceaccount.com

      - name: 確認 gcloud 可用
        run: |
          # ubuntu runner 預裝 gcloud，所以不用 setup-gcloud（那一步每個 job 要花 15~25 秒）。
          # 若哪天 runner image 拿掉了，這裡會立刻紅燈，而不是在後面噴看不懂的錯。
          command -v gcloud >/dev/null || { echo "::error::runner 沒有預裝 gcloud，請把 setup-gcloud 加回來"; exit 1; }
          gcloud --version | head -1

      - name: 部署
        id: deploy
        uses: adamsourceinfo-org/ci/.github/actions/deploy-service@main
        with:
          service: ${{ needs.verify.outputs.service }}
          digest: ${{ needs.promote.outputs.digest }}
          region: ${{ needs.verify.outputs.region }}
          project: ${{ env.PROD_PROJECT }}
          env_name: prod
          app_version: ${{ github.ref_name }}
          allow_unauthenticated: ${{ needs.verify.outputs.allow_unauthenticated }}
          runtime_sa: ${{ needs.verify.outputs.runtime_sa }}
          db_name: ${{ needs.verify.outputs.db_name }}
          ar_host: ${{ env.AR_HOST }}
          ar_repo: ${{ env.AR_REPO }}
          sql_instance: ${{ env.SQL_INSTANCE }}

  # ── 8. smoke-prod（只有 tag）──────────────────────────────────────────────
  smoke-prod:
    name: 8 smoke prod
    if: github.event_name != 'pull_request' && github.ref_type == 'tag'
    needs: [verify, resolve, promote, deploy-prod]
    runs-on: ubuntu-latest
    steps:
      - name: 健康檢查
        env:
          URL: ${{ needs.deploy-prod.outputs.url }}
          HEALTH_PATH: ${{ needs.verify.outputs.health_path }}
        run: |
          set -euo pipefail
          TARGET="${URL%/}${HEALTH_PATH}"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$TARGET" || echo 000)
            echo "attempt $i: HTTP $CODE  $TARGET"
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ]; then
              echo "✅ prod 健康檢查通過"
              {
                echo "### 🚀 發布到 prod"
                echo ""
                echo "| | |"
                echo "|---|---|"
                echo "| 服務 | \`${{ needs.verify.outputs.service }}\` |"
                echo "| 版本 | \`${{ github.ref_name }}\` |"
                echo "| 環境 | \`adamsourceinfo-prod\` |"
                echo "| commit | \`${{ needs.verify.outputs.short_sha }}\` |"
                echo "| digest | \`${{ needs.promote.outputs.digest }}\` |"
                echo "| URL | ${URL} |"
                echo ""
                echo "此 digest 與 dev 驗證過的 image 完全相同（未重新 build）。"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::prod 健康檢查失敗（最後一次 HTTP ${CODE}，目標 ${TARGET}）。"
          exit 1
