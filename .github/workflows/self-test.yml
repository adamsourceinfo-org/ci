# ci repo 自己的 PR 檢查。
#
# 這支存在的理由：deploy.yml / ci.yml 都是 workflow_call 專用，在本 repo 的 PR 上永遠
# 不會執行。若把 new-project.sh 那份 ruleset 原封不動套到這裡，required check
# 「ci / 1 verify」永遠不會回報，所有 PR 會被卡死。所以本 repo 需要自己的檢查。
name: self-test
on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: YAML 語法
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml
          for f in sorted(glob.glob(".github/workflows/*.yml") + glob.glob("templates/*.yml")):
              with open(f, encoding="utf-8") as fh:
                  yaml.safe_load(fh)
              print("ok", f)
          PY

      - name: bash 語法
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do bash -n "$f" && echo "ok $f"; done

      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          /tmp/actionlint -color
