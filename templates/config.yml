# 專案的結構性設定。全部選填 —— 刪掉整個檔案也能跑，只是全用預設值。
# 常改的環境變數請放 .cicd/env.common 與 .cicd/env.<env>。

# service: my-app          # Cloud Run 服務名稱，預設用 repo 名稱
# region: asia-east1
# health_path: /healthz    # smoke test 打的路徑，預設 /
# dockerfile: Dockerfile
# allow_unauthenticated: true

# 要用 Cloud SQL 就打開這段。注意「只宣告一次」—— 不是 dev/prod 各一份。
# instance 必須先由有 GCP 權限的人建好，CI 不會自動建（見 README）。
# db:
#   instance: my-app-pg
#   name: my_app
